[package]
name = "jig-protocol-accounts-world"
description = "The accounts child over the real driver and the secrets' store that keeps its records"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-world.workspace = true
jig-domain-accounts.workspace = true
jig-domain-core.workspace = true
jig-protocol-accounts.workspace = true
jig-protocol-config.workspace = true
jig-protocol-store.workspace = true
skein-kv.workspace = true
skein-sim.workspace = true
skein-fake-oauth.workspace = true
skein-fake-peers.workspace = true
skein-http.workspace = true
skein-tls.workspace = true
skein-oauth.workspace = true
skein-oauth-accounts.workspace = true
skein-io.workspace = true
skein-heap.workspace = true

[dev-dependencies]
skein-codegen.workspace = true
skein-scratch.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
